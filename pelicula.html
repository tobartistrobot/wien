<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B100E">
<meta name="robots" content="noindex, nofollow">
<title>Wien · La película</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
@font-face{font-family:"Jost";src:url(fonts/jost-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Jost";src:url(fonts/jost-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Jost";src:url(fonts/jost-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Poiret One";src:url(fonts/poiret-one-latin-400-normal.woff2) format("woff2");font-display:swap}
:root{
  --bg:#0B100E; --ink:#F4EEDF; --muted:#BDB6A5; --gold:#D8B55A; --gold-2:#F1D98E;
  --k:#8FC3E0; --p:#F3A6B8; --lcd:#FF9A3C;
  --display:"Poiret One","Futura","Century Gothic",sans-serif;
  --body:"Jost","Futura","Avenir Next","Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#film{position:fixed;inset:0;overflow:hidden;background:#000}
#frame{position:absolute;inset:0;margin:auto;width:100%;height:100%;max-width:calc(100dvh * .62);overflow:hidden;background:#000}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#stage{position:absolute;inset:0;z-index:2}
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}
#flash{position:absolute;inset:0;background:#FFF6DC;opacity:0;pointer-events:none;z-index:6}
#flash.on{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}

/* capa de película: viñeta, grano y destellos de luz */
.film-fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.film-fx:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.6) 100%)}
.film-fx:after{content:"";position:absolute;inset:-50%;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain .5s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
.leak{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:screen;opacity:0;background:radial-gradient(60% 45% at 10% 15%,rgba(255,150,70,.55),transparent 70%),radial-gradient(50% 40% at 95% 85%,rgba(255,90,120,.4),transparent 70%);animation:leak 7s ease-in-out infinite}
@keyframes leak{0%,100%{opacity:0;transform:translateX(-4%)}45%{opacity:.6}70%{opacity:.25;transform:translateX(5%)}}

/* barra de capítulos y controles */
#bars{position:absolute;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:4px;z-index:8}
#bars i{flex:1;height:2.5px;border-radius:2px;background:rgba(244,238,223,.25);overflow:hidden}
#bars i b{display:block;height:100%;width:0;background:var(--gold-2)}
#ctl{position:absolute;right:10px;top:calc(18px + env(safe-area-inset-top,0px));z-index:9;display:flex;gap:6px}
#ctl button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:var(--ink);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
#ctl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tapL,#tapR{position:absolute;top:60px;bottom:0;z-index:7}
#tapL{left:0;width:30%}#tapR{right:0;width:70%}
#pauseTag{position:absolute;inset:0;display:grid;place-items:center;z-index:6;pointer-events:none;opacity:0;transition:opacity .2s}
#pauseTag span{font-family:var(--display);font-size:22px;letter-spacing:.2em;background:rgba(0,0,0,.45);padding:10px 18px;border-radius:30px}
#film.isPaused #pauseTag{opacity:1}

/* básicos de escena */
.sc{position:absolute;inset:0;overflow:hidden}
.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px;z-index:2}
.disp{font-family:var(--display);font-weight:400;line-height:1.08}
.gold{background:linear-gradient(100deg,#9C7A26 0%,#F1D98E 30%,#C9A227 50%,#FFF2C4 62%,#B8902E 80%,#E2C36A 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-100% 0}}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes up{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.fade{opacity:0;animation:fade 1s ease forwards;animation-delay:var(--d,0s)}
@keyframes fade{to{opacity:1}}
.inout{opacity:0;animation:inA .9s ease forwards var(--d,0s),outA .8s ease forwards var(--o,99s)}
@keyframes inA{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes outA{to{opacity:0;transform:translateY(-10px);filter:blur(4px)}}
.pop{opacity:0;animation:pop .7s cubic-bezier(.2,1.5,.4,1) forwards;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.slam{opacity:0;animation:slam .55s cubic-bezier(.2,1.2,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes slam{from{opacity:0;transform:scale(2.4);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.t1{font-size:clamp(30px,9.5vw,52px)}
.t2{font-size:clamp(22px,6.6vw,36px)}
.t3{font-size:clamp(17px,4.6vw,23px);line-height:1.4}
.kick{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-2)}
.muted{color:var(--muted)}

/* fotos */
.ph{position:absolute;inset:-5%;background-size:cover;background-position:center;opacity:0}
.ph.old{filter:sepia(.8) contrast(1.05) brightness(.85);animation:phIn 1s ease forwards,kb 6s linear forwards,phOut 1s ease forwards var(--o,1.6s)}
.ph.us{animation:phIn 1.1s ease forwards var(--d,0s),kb2 var(--l,6s) linear forwards var(--d,0s),phOut 1s ease forwards var(--o,99s);filter:saturate(1.08) contrast(1.04) sepia(.08)}
.ph.blur{opacity:1;filter:blur(16px) brightness(.32) saturate(1.2);inset:-12%}
@keyframes phIn{to{opacity:1}}
@keyframes phOut{to{opacity:0}}
@keyframes kb{from{transform:scale(1.18) translate(2%,1%)}to{transform:scale(1.04) translate(-1%,-1%)}}
@keyframes kb2{from{transform:scale(1.03)}to{transform:scale(1.17) translate(-2%,1%)}}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(5,8,7,.75) 74%,rgba(5,8,7,.94) 100%)}
.lcd{position:absolute;right:18px;top:calc(122px + env(safe-area-inset-top,0px));z-index:2;font:600 15px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.12em;color:var(--lcd);text-shadow:0 0 6px rgba(255,120,40,.9),0 0 14px rgba(255,90,20,.5)}
.yr{position:absolute;left:20px;top:calc(40px + env(safe-area-inset-top,0px));z-index:2;font-family:var(--display);font-size:clamp(36px,11vw,58px);color:var(--gold-2);text-shadow:0 2px 18px rgba(0,0,0,.6);opacity:0}
.yr span{display:block;font-family:var(--body);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);opacity:.85;margin-top:2px}
.yr.a{animation:inA .7s ease forwards .2s,outA .5s ease forwards var(--o,1.5s)}
.yr.b{animation:inA .7s ease forwards var(--d,1.7s)}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 22px calc(30px + env(safe-area-inset-bottom,0px))}
.cap .when{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-2)}
.cap h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,10.5vw,54px);line-height:1;margin:6px 0 6px;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.cap .kind{font-size:15px;color:var(--muted)}
.quote{font-family:var(--display);font-size:clamp(19px,5.4vw,26px);line-height:1.3;color:var(--ink);margin-top:14px;padding-left:14px;border-left:2px solid var(--gold)}

/* duelo */
.du-top{position:absolute;left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));text-align:center;z-index:2;padding:0 24px}
.du-top .t{font-family:var(--display);font-size:clamp(26px,8vw,40px);margin-top:8px}
.du-q{font-size:clamp(18px,5vw,23px);line-height:1.4;max-width:17em;margin:0 auto}
.du-ask{margin-top:26px;font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-2)}
.vs{display:flex;gap:14px;justify-content:center;margin-top:16px}
.who{width:38vw;max-width:170px;padding:16px 10px 14px;border-radius:20px;border:1px solid rgba(244,238,223,.2);background:rgba(255,255,255,.06);backdrop-filter:blur(6px);transition:transform .35s cubic-bezier(.2,1.4,.3,1),opacity .35s,box-shadow .35s,background .35s}
.who b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(26px,8vw,38px)}
.who span{display:block;margin-top:4px;font-size:15px;color:var(--muted);min-height:1.2em}
.who.k b{color:var(--k)}.who.p b{color:var(--p)}
.vs.wait .who{animation:beat .6s ease-in-out infinite}
.vs.wait .who.p{animation-delay:.3s}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.06)}}
.who.win{transform:scale(1.1);background:rgba(241,217,142,.16);border-color:var(--gold-2);box-shadow:0 0 40px rgba(241,217,142,.45)}
.who.win span{color:var(--gold-2);font-weight:600}
.who.win.tie{transform:scale(1.02)}
.who.lose{opacity:.35;transform:scale(.92)}
.du-ans{margin-top:22px;font-size:16px;line-height:1.45;color:var(--ink);max-width:21em;opacity:0}
.du-ans.on{animation:up .7s ease forwards}

/* día */
.day .big{font-family:var(--display);font-size:clamp(150px,52vw,260px);line-height:.8}
.day .wd{font-family:var(--display);font-size:clamp(30px,9vw,46px);margin-top:10px}
.day .tt{font-size:16px;color:var(--muted);margin-top:10px;max-width:22em}
.ring{position:absolute;left:50%;top:50%;width:150vmin;height:150vmin;margin:-75vmin 0 0 -75vmin;border-radius:50%;border:1px solid rgba(216,181,90,.18);animation:ring 7s linear infinite;z-index:1}
.ring.b{width:110vmin;height:110vmin;margin:-55vmin 0 0 -55vmin;animation-duration:9s;animation-direction:reverse;border-style:dashed}
@keyframes ring{to{transform:rotate(360deg)}}

/* vuelo y cifras */
.flight svg{width:100%;max-width:520px}
.flight .path{fill:none;stroke:var(--gold-2);stroke-width:2;stroke-dasharray:4 6}
.flight .trail{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linecap:round}
.flight .city{fill:var(--ink);font-family:var(--display);font-size:22px}
.flight .sub{fill:var(--muted);font-family:var(--body);font-size:12px;letter-spacing:.18em}
.flight .dot{fill:var(--gold-2)}
.num{font-family:var(--display);font-size:clamp(64px,22vw,120px);line-height:1}
.stat .num{font-size:clamp(110px,40vw,200px)}
.stat .lab{font-size:clamp(18px,5vw,24px);margin-top:8px;max-width:16em;line-height:1.35}
.stat .det{font-size:15px;color:var(--muted);margin-top:14px;max-width:22em;line-height:1.45}

/* final */
.arena{display:flex;align-items:flex-end;justify-content:center;gap:9vw;height:40vh;width:100%;margin-top:18px}
.col{display:flex;flex-direction:column;align-items:center;width:30vw;max-width:150px;height:100%;justify-content:flex-end}
.col .bar{width:100%;border-radius:14px 14px 4px 4px;height:0}
.col.k .bar{background:linear-gradient(180deg,#B8DDF0,#4E87A6)}
.col.p .bar{background:linear-gradient(180deg,#FFD0DA,#C2566E)}
.col .sc2{font-family:var(--display);font-size:clamp(48px,15vw,78px);line-height:1;margin-bottom:8px}
.col .nm{margin-top:10px;font-size:15px;letter-spacing:.24em;text-transform:uppercase}
.col.win .bar{box-shadow:0 0 40px rgba(241,217,142,.55),inset 0 0 0 2px rgba(255,242,196,.8)}
.crown{display:block;width:58px;height:40px;margin:0 auto 6px;opacity:0;transform:translateY(-120px) rotate(-20deg)}
.crown.on{animation:crown .9s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes crown{to{opacity:1;transform:none}}

/* mapa */
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .rp{fill:none;stroke:var(--gold);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(216,181,90,.7))}
.map .pt{fill:var(--gold-2);opacity:0}
.map .pt.on{animation:pop .5s cubic-bezier(.2,1.5,.4,1) forwards}
.map .halo{fill:rgba(241,217,142,.2);opacity:0}
.map .halo.on{animation:halo 1.2s ease-out forwards}
@keyframes halo{0%{opacity:1;r:4}100%{opacity:0;r:26}}
.map .now{font-family:var(--display);font-size:clamp(22px,6.4vw,30px);min-height:1.3em;margin-bottom:6px}
.map .ttl{position:absolute;left:0;right:0;top:calc(46px + env(safe-area-inset-top,0px));text-align:center}
.map .ft{position:absolute;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom,0px));text-align:center}

/* polaroids */
.pola{position:absolute;width:min(46%,210px);background:#FBF7EC;padding:7px 7px 26px;box-shadow:0 14px 40px rgba(0,0,0,.6);opacity:0;transform:translate(-50%,-50%) translateY(-60vh) rotate(var(--r,0deg));animation:pdrop .9s cubic-bezier(.2,1.1,.3,1) forwards var(--d,0s)}
.pola .im{width:100%;aspect-ratio:4/5;background-size:cover;background-position:center}
.pola p{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-family:var(--display);font-size:13px;color:#2A2A2A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
@keyframes pdrop{to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r,0deg))}}

/* puerta */
#gate{position:fixed;inset:0;z-index:20;overflow-y:auto;background:radial-gradient(120% 80% at 50% 25%,#1B2621 0%,#0B100E 60%)}
#gate .in{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 22px}
#gate .w{font-family:var(--display);font-size:clamp(84px,30vw,150px);line-height:1}
#gate .s{margin-top:8px;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-2)}
#gate .n{margin-top:14px;font-family:var(--display);font-size:24px}
.btn{border:0;border-radius:40px;padding:16px 28px 16px 22px;font:500 17px var(--body);display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.btn svg{width:20px;height:20px}
.btn.pri{color:#1A1406;background:linear-gradient(100deg,#C9A227,#F1D98E 55%,#D8B55A);box-shadow:0 10px 40px rgba(216,181,90,.35)}
.btn.pri svg{fill:#1A1406}
.btn.sec{color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(244,238,223,.22);padding:13px 20px;font-size:15px}
.btn.sec svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.btn:disabled{opacity:.55}
#go{margin-top:36px}
#add{margin-top:14px}
#gate .h{margin-top:16px;font-size:13px;color:var(--muted);max-width:26em;line-height:1.45}
#status{margin-top:10px;font-size:13px;color:var(--gold-2);min-height:1.2em}
#thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:360px;margin-top:14px}
#thumbs:empty{display:none}
#thumbs figure{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#222}
#thumbs img{width:100%;height:100%;object-fit:cover;display:block}
#thumbs figcaption{position:absolute;left:0;right:0;bottom:0;font-size:9px;padding:10px 3px 3px;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#thumbs button{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;cursor:pointer}
.endb{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap;justify-content:center;position:relative;z-index:9}
.endb a,.endb button{border:1px solid rgba(244,238,223,.25);border-radius:30px;padding:12px 18px;font:500 15px var(--body);color:var(--ink);background:rgba(255,255,255,.06);text-decoration:none;cursor:pointer}
.endb .pri{background:linear-gradient(100deg,#C9A227,#F1D98E 55%,#D8B55A);color:#1A1406;border:0}
@media (prefers-reduced-motion:reduce){.gold{animation:none}.film-fx:after{animation:none}}
</style>
</head>
<body>
<div id="gate"><div class="in">
  <p class="s">Una película de nuestro viaje</p>
  <p class="w gold">Wien</p>
  <p class="n" id="gnames">Kevin &amp; Pilu</p>
  <button class="btn pri" id="go" disabled><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg><span>Cargando recuerdos…</span></button>
  <button class="btn sec" id="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Añadir fotos del viaje</span></button>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <p id="status"></p>
  <p class="h">Elige de tu galería las fotos de Viena: cada una se coloca sola en su sitio y en su momento, y le aparecen también a la otra persona.</p>
  <div id="thumbs"></div>
  <p class="h">Sube el volumen. Toca a la derecha para avanzar, a la izquierda para volver y mantén pulsado para pausar.</p>
</div></div>
<div id="film">
  <div id="frame">
    <div id="stage"></div>
    <div class="leak"></div>
    <div class="film-fx"></div>
    <canvas id="fx"></canvas>
    <div id="flash"></div>
    <div id="bars"></div>
    <div id="ctl">
      <button id="mute" aria-label="Silenciar"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="mwave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
      <button id="close" aria-label="Volver a la app"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div id="tapL"></div><div id="tapR"></div>
    <div id="pauseTag"><span>Pausa</span></div>
  </div>
</div>

<script>
(() => {

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TZ = "Europe/Vienna";
const CFG = {

  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZva2p4cGtmd3pwZ292dmd0c211Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODYxNzEsImV4cCI6MjEwNTE2MjE3MX0.A9r9bTXXbIGU7RNyY1xDyp4wLGmxjppLEMQDb_bGcwg"
};
const ls = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } };
const CODE = ls("wien-code") || "", ME = ls("wien-me") || "";

function drawBars() { $("#bars").innerHTML = CH.map(() => "<i><b></b></i>").join(""); }
function show(i) {
  i = Math.max(0, Math.min(FLAT.length - 1, i));
  cur = i; sceneT = 0; counters = []; timers = [];
  const { s } = FLAT[i];
  const el = document.createElement("div"); el.className = "sc";
  stage.innerHTML = ""; stage.appendChild(el);
  s.build(el);
  music.level(s.music == null ? 1 : s.music);
  if (s.duck) { at(s.duck[0], () => music.duck(true)); at(s.duck[1], () => music.duck(false)); }
  if (s.end) music.ending();
  updBars();
}
function updBars() {
  const bs = $("#bars").children, f = FLAT[cur]; if (!f) return;
  const chs = CH[f.ci], cap = s => Math.min(s.dur, 15), tot = chs.reduce((a, s) => a + cap(s), 0);
  let done = 0; for (let j = 0; j < f.si; j++) done += cap(chs[j]);
  done += Math.min(sceneT, cap(chs[f.si]));
  for (let j = 0; j < bs.length; j++) bs[j].firstChild.style.width = j < f.ci ? "100%" : j > f.ci ? "0" : Math.min(100, done / tot * 100) + "%";
}
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.1, (now - last) / 1000 || 0); last = now;
  if (!paused && cur >= 0) {
    sceneT += dt;
    const s = FLAT[cur].s;
    timers.forEach(x => { if (!x.done && sceneT >= x.t) { x.done = true; try { x.fn(); } catch (e) {} } });
    counters.forEach(c => {
      if (c.custom) return c.custom(sceneT);
      const f = Math.max(0, Math.min(1, (sceneT - c.start) / c.len)), e = 1 - Math.pow(1 - f, 3), v = c.from + (c.to - c.from) * e;
      const txt = Number.isInteger(c.to) ? Math.round(v).toLocaleString("es-ES") : v.toLocaleString("es-ES", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      if (txt !== c.last) { c.el.textContent = txt; if (c.tick && c.last !== null) sfx.tick(); c.last = txt; }
    });
    if (sceneT >= s.dur && cur < FLAT.length - 1) show(cur + 1);
    updBars();
  }
  fx.step(paused);
}
function setPause(p) { paused = p; stage.classList.toggle("paused", p); $("#film").classList.toggle("isPaused", p); music.pause(p); }
function restart() { setPause(false); music.restart(); show(0); }

/* ---------- Partículas ---------- */
const fx = (() => {
  const cv = $("#fx"), ctx = cv.getContext("2d"); let W = 0, H = 0, flakes = [], bits = [];
  function size() { const dpr = Math.min(2, window.devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  window.addEventListener("resize", size);
  function init() { size(); flakes = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + .6, vy: -(Math.random() * .25 + .08), vx: (Math.random() - .5) * .15, a: Math.random() * 6.28, s: Math.random() * .03 + .01 })); }
  const cols = ["#F1D98E", "#D8B55A", "#FFF2C4", "#E0677A", "#8FC3E0", "#F3A6B8", "#79AE98"];
  function burst(px, py, n) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = Math.random() * 6 + 2; bits.push({ x: W * px, y: H * py, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, r: Math.random() * 2.5 + 1, c: cols[Math.floor(Math.random() * 3)], life: 1, rot: 0, vr: 0, sq: false }); } }
  function confetti() { for (let i = 0; i < 180; i++) bits.push({ x: W * (.1 + Math.random() * .8), y: -20 - Math.random() * H * .5, vx: (Math.random() - .5) * 3, vy: Math.random() * 2 + 2, r: Math.random() * 4 + 3, c: cols[Math.floor(Math.random() * cols.length)], life: 2.6, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, sq: true }); }
  function step(p) {
    ctx.clearRect(0, 0, W, H);
    flakes.forEach(f => { if (!p) { f.y += f.vy; f.x += f.vx; f.a += f.s; } if (f.y < -5) { f.y = H + 5; f.x = Math.random() * W; } ctx.globalAlpha = .2 + .3 * (Math.sin(f.a) * .5 + .5); ctx.fillStyle = "#F1D98E"; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.28); ctx.fill(); });
    bits = bits.filter(b => b.life > 0 && b.y < H + 30);
    bits.forEach(b => { if (!p) { b.vy += b.sq ? .04 : .12; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.life -= b.sq ? .004 : .014; }
      ctx.globalAlpha = Math.max(0, Math.min(1, b.life)); ctx.fillStyle = b.c;
      if (b.sq) { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot); ctx.fillRect(-b.r, -b.r / 2.5, b.r * 2, b.r / 1.25); ctx.restore(); } else { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fill(); } });
    ctx.globalAlpha = 1;
  }
  return { init, burst, confetti, step };
})();

/* ---------- Música: vals original para caja de música, con silencios de suspense ---------- */
const music = (() => {
  let ctx = null, master = null, mus = null, sfxBus = null, lvl = 0, tgt = 0, nextT = 0, beat = 0, ending = false, endAt = 0, mute = false, noise = null;
  const BEAT = .4, mf = m => 440 * Math.pow(2, (m - 69) / 12);
  const A = [[74,1],[78,1],[81,1],[81,2],[78,1],[79,1],[76,1],[73,1],[76,3],[79,1],[76,1],[73,1],[69,2],[73,1],[78,1],[76,1],[74,1],[74,3],
             [74,1],[78,1],[81,1],[86,2],[81,1],[83,1],[81,1],[79,1],[83,2],[79,1],[81,1],[78,1],[74,1],[76,1],[79,1],[73,1],[74,3],[null,2],[69,1]];
  const Am = ["D","D","A7","A7","A7","A7","D","D","D","D","G","G","D","A7","D","D"];
  const B = [[71,1],[74,1],[78,1],[78,2],[76,1],[70,1],[73,1],[76,1],[78,3],[74,1],[78,1],[83,1],[83,2],[81,1],[80,1],[76,1],[74,1],[73,2],[69,1],
             [71,1],[74,1],[79,1],[83,2],[79,1],[81,1],[78,1],[74,1],[78,2],[81,1],[79,1],[76,1],[71,1],[73,1],[76,1],[79,1],[78,2],[76,1],[74,3]];
  const Bm = ["Bm","Bm","F#7","F#7","Bm","Bm","E7","A7","G","G","D","D","Em","A7","D","D"];
  const CH = { D: [50, 62, 66, 69], A7: [45, 61, 64, 67], G: [43, 59, 62, 67], Bm: [47, 62, 66, 71], "F#7": [42, 61, 64, 70], E7: [40, 62, 64, 68], Em: [40, 59, 64, 67] };
  const seq = []; [[A, Am], [A, Am], [B, Bm], [A, Am]].forEach(([mel, ch]) => { const b0 = seq.length; for (let i = 0; i < ch.length * 3; i++) seq.push({ mel: null, ch: ch[Math.floor(i / 3)], pos: i % 3 }); let p = 0; mel.forEach(([n, d]) => { if (n != null && seq[b0 + p]) seq[b0 + p].mel = [n, d]; p += d; }); });
  function init() {
    if (ctx) return; const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3;
    const len = ctx.sampleRate * 2.6, ib = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ib.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    const rv = ctx.createConvolver(); rv.buffer = ib;
    mus = ctx.createGain(); sfxBus = ctx.createGain(); const wetM = ctx.createGain(); wetM.gain.value = .34; const wetS = ctx.createGain(); wetS.gain.value = .18;
    mus.connect(master); mus.connect(wetM); wetM.connect(rv); sfxBus.connect(master); sfxBus.connect(wetS); wetS.connect(rv); rv.connect(master);
    master.connect(comp); comp.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(.9, ctx.currentTime + 1.2);
    noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    nextT = ctx.currentTime + .15; beat = 0; setInterval(sched, 40);
  }
  function env(g, t, vol, len) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .005); g.gain.exponentialRampToValueAtTime(.0008, t + len); }
  function box(t, m, dur, vol) { const f = mf(m), g = ctx.createGain(); env(g, t, vol, Math.min(2.6, .9 + dur)); [[1, 1], [2, .28], [3.98, .07]].forEach(([h, a]) => { const o = ctx.createOscillator(); o.frequency.value = f * h; const gg = ctx.createGain(); gg.gain.value = a; o.connect(gg); gg.connect(g); o.start(t); o.stop(t + 2.8); }); g.connect(mus); }
  function pluck(t, m, vol, len = .5, type = "triangle") { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = mf(m); env(g, t, vol, len); o.connect(g); g.connect(mus); o.start(t); o.stop(t + len + .05); }
  function pad(t, notes, len, vol) { notes.forEach(m => { const o = ctx.createOscillator(), o2 = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain(); o.type = o2.type = "sawtooth"; o.frequency.value = mf(m); o2.frequency.value = mf(m) * 1.004; lp.frequency.value = 900; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + len * .4); g.gain.linearRampToValueAtTime(0, t + len); o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(mus); o.start(t); o2.start(t); o.stop(t + len + .1); o2.stop(t + len + .1); }); }
  function sched() {
    if (!ctx || ctx.state !== "running") return;
    while (nextT < ctx.currentTime + .25) {
      lvl += (Math.max(0, tgt) - lvl) * .08;
      const s = seq[beat % seq.length], c = CH[s.ch];
      const fade = ending ? Math.max(0, 1 - (nextT - endAt) / 7) : 1;
      if (fade > 0 && tgt >= 0) {
        if (s.mel) { box(nextT, s.mel[0], s.mel[1] * BEAT, .16 * fade); if (lvl > 1.4) box(nextT, s.mel[0] + 12, s.mel[1] * BEAT, .045 * fade); }
        if (s.pos === 0) { pluck(nextT, c[0], (.14 + .06 * Math.min(1, lvl)) * fade, .9, "sine"); if (lvl > .6) pluck(nextT, c[0] + 12, .05 * fade, .6, "sine"); if (lvl > 1.4 && beat % 6 === 0) pad(nextT, c.slice(1), BEAT * 6, .018 * fade); }
        else { const v = (.028 + .02 * Math.min(1, lvl)) * fade; c.slice(1).forEach(m => pluck(nextT, m, v, .28)); }
        if (lvl > 1.6 && s.pos === 2 && beat % 12 === 11) [0, 1, 2, 3].forEach(i => box(nextT + i * .08, c[1 + (i % 3)] + 24, .2, .03 * fade));
      }

  }
  return {
    start() { init(); if (ctx && ctx.state === "suspended") ctx.resume(); },
    level(v) { tgt = v; if (mus) mus.gain.setTargetAtTime(v < 0 ? 0 : 1, ctx.currentTime, .3); },
    duck(d) { if (mus) mus.gain.setTargetAtTime(d ? .15 : (tgt < 0 ? 0 : 1), ctx.currentTime, .15); },
    ending() { if (ctx && !ending) { ending = true; endAt = ctx.currentTime + 4; } },
    restart() { if (!ctx) return; ending = false; beat = 0; nextT = ctx.currentTime + .1; lvl = 0; },
    pause(p) { if (ctx) p ? ctx.suspend() : ctx.resume(); },
    mute() { mute = !mute; if (master) master.gain.setTargetAtTime(mute ? 0 : .9, ctx.currentTime, .1); return !mute; },
    ctx: () => ctx, bus: () => sfxBus, noise: () => noise, muted: () => mute

})();
const sfx = (() => {
  const C = () => music.ctx(), ok = () => C() && !music.muted() && !paused;
  function tone(f, t0, len, vol, type = "sine", f2) { const c = C(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0; o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + len * .6); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .005); g.gain.exponentialRampToValueAtTime(.0008, t + len); o.connect(g); g.connect(music.bus()); o.start(t); o.stop(t + len + .05); }
  function nz(t0, len, vol, type, freq, q = 1) { const c = C(), s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime + t0; s.buffer = music.noise(); f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .004); g.gain.exponentialRampToValueAtTime(.0008, t + len); s.connect(f); f.connect(g); g.connect(music.bus()); s.start(t, Math.random()); s.stop(t + len + .05); }
  let lastTick = 0;
  return {
    tick() { if (!ok()) return; const c = C(); if (c.currentTime - lastTick < .045) return; lastTick = c.currentTime; tone(1900 + Math.random() * 300, 0, .05, .028, "triangle"); },
    blip(i) { if (!ok()) return; tone(880 * Math.pow(2, ((i * 2) % 12) / 12), 0, .35, .05); },
    chime(v = 1) { if (!ok()) return; tone(1318.5, 0, 1.4, .07 * v); tone(1975.5, .06, 1.2, .05 * v); },
    heart() { if (!ok()) return; tone(78, 0, .28, .55, "sine", 42); tone(70, .2, .3, .4, "sine", 40); },
    roll(len) { if (!ok() || len <= 0) return; const n = Math.floor(len / .055); for (let i = 0; i < n; i++) nz(i * .055, .05, .015 + .1 * (i / n), "bandpass", 2400, 1.2); },
    hit() { if (!ok()) return; tone(60, 0, .9, .6, "sine", 35); nz(0, 1.2, .1, "highpass", 3500); },
    reveal(big) { if (!ok()) return; nz(0, big ? 2.4 : 1.3, big ? .16 : .1, "highpass", 4200); tone(60, 0, .6, .45, "sine", 38); [62, 66, 69, 74].forEach((m, i) => tone(440 * Math.pow(2, (m - 69) / 12), i * .02, big ? 2.2 : 1.1, .05, "triangle")); tone(1975.5, .1, 1.2, .045); },
    shutter() { if (!ok()) return; nz(0, .06, .12, "highpass", 2000); nz(.09, .05, .08, "highpass", 2500); },
    paper(i) { if (!ok()) return; nz(0, .12, .06, "bandpass", 1200 + (i % 5) * 200, .8); tone(220 + (i % 4) * 30, 0, .12, .05, "sine", 120); },
    fanfare(soft) { if (!ok()) return; const v = soft ? .05 : .08; [[74, 0], [78, .12], [81, .24], [86, .36]].forEach(([m, t]) => tone(440 * Math.pow(2, (m - 69) / 12), t, 1.6, v, "triangle")); tone(440 * Math.pow(2, (90 - 69) / 12), .5, 2, v * .7); }
  };
})();

/* ---------- Controles ---------- */
let holdT = null, held = false;
function nav(dir) { if (FLAT[cur] && FLAT[cur].s.end && dir > 0) return; show(cur + dir); }
function bindTap(el, dir) {
  el.addEventListener("pointerdown", () => { held = false; holdT = setTimeout(() => { held = true; setPause(true); }, 280); });
  el.addEventListener("pointerup", () => { clearTimeout(holdT); if (held || paused) { setPause(false); return; } nav(dir); });
  el.addEventListener("pointercancel", () => { clearTimeout(holdT); if (held) setPause(false); });
  el.addEventListener("contextmenu", e => e.preventDefault());
}
bindTap($("#tapL"), -1); bindTap($("#tapR"), 1);
document.addEventListener("keydown", e => { if (cur < 0) return; if (e.key === "ArrowRight") nav(1); else if (e.key === "ArrowLeft") nav(-1); else if (e.key === " ") { e.preventDefault(); setPause(!paused); } });
$("#mute").addEventListener("click", e => { e.stopPropagation(); const on = music.mute(); $("#mwave").style.display = on ? "" : "none"; });
$("#close").addEventListener("click", e => { e.stopPropagation(); location.href = "./"; });
document.addEventListener("visibilitychange", () => { if (document.hidden && cur >= 0) setPause(true); });

/* ---------- Fotos de la película: añadir, compartir, quitar ---------- */
let KV = {}, PH = {}, FILM = {}, fdb = null;
const status = t => { $("#status").textContent = t || ""; };
function renderThumbs() {
  const items = Object.values(FILM).sort((a, b) => (a.shot || 0) - (b.shot || 0));
  $("#thumbs").innerHTML = items.map(f => `<figure><img src="${f.src}" alt=""><figcaption>${esc(f.place && PLACES[f.place] ? PLACES[f.place].name : "Viena")}</figcaption><button data-del="${esc(f.id)}" aria-label="Quitar">×</button></figure>`).join("");
  $("#add span").textContent = items.length ? `Añadir más fotos (${items.length})` : "Añadir fotos del viaje";
}
function rebuild() { D = build(KV, PH, FILM); CH = storyboard(); flatten(); drawBars(); $("#gnames").innerHTML = `${nm("k")} &amp; ${nm("p")}`; }
function firstTimes() { const firstAt = {}; for (const key in KV) { const v = KV[key] && KV[key].v; if (v && !v.del && /^(r|s|f):/.test(key)) { const id = key.slice(2).replace(/-\d+$/, ""); const a = +(v.at || KV[key].at || 0); if (a && (!firstAt[id] || a < firstAt[id])) firstAt[id] = a; } } return firstAt; }
$("#add").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", async e => {
  const files = [...e.target.files]; e.target.value = ""; if (!files.length) return;
  const firstAt = firstTimes(); let n = 0, placed = 0, added = 0;
  $("#go").disabled = true;
  for (const f of files) {
    n++; status(`Preparando foto ${n} de ${files.length}…`);
    let meta = {}; try { meta = readExif(await f.slice(0, 262144).arrayBuffer()); } catch (err) {}
    const shot = exifMs(meta.date) || f.lastModified || 0;
    const src = await shrink(f); if (!src) continue;
    const place = placeFor(shot, meta.lat, meta.lon, firstAt); if (place) placed++;
    const id = "f" + shot.toString(36) + Math.random().toString(36).slice(2, 7);
    const rec = { id, place, shot, src, by: ME || "k", up: false };
    FILM[id] = rec; await idbPut(fdb, "ph", id, rec); added++;
  }
  renderThumbs(); rebuild(); $("#go").disabled = false;
  status(`${added} ${added === 1 ? "foto añadida" : "fotos añadidas"}, ${placed} ${placed === 1 ? "colocada" : "colocadas"} en su sitio.`);
  await upload();
});
$("#thumbs").addEventListener("click", async e => {
  const b = e.target.closest("[data-del]"); if (!b) return;
  if (!confirm("¿Quitar esta foto de la película? Se quita en los dos móviles.")) return;
  const id = b.dataset.del; delete FILM[id]; await idbDel(fdb, "ph", id); renderThumbs(); rebuild();
  rpc("wien_film_del", { p_id: id });
});
async function upload() {
  const pend = Object.values(FILM).filter(f => !f.up); if (!pend.length || !CODE) return;
  let ok = 0;
  for (const f of pend) {
    status(`Compartiendo foto ${ok + 1} de ${pend.length}…`);
    const r = await rpc("wien_film_put", { p_id: f.id, p_place: f.place || "", p_shot: f.shot || 0, p_data: f.src, p_by: f.by || "k" });
    if (r && r.ok) { f.up = true; ok++; await idbPut(fdb, "ph", f.id, f); } else break;
  }
  status(ok === pend.length ? "Listo: las fotos también le salen a la otra persona." : "Sin conexión: las que faltan se compartirán la próxima vez que abras la película.");
}
async function download() {
  const r = await rpc("wien_film_list", {}); if (!r || !r.ok) return;
  const ids = new Set(r.items.map(x => x.id));
  for (const id of Object.keys(FILM)) if (FILM[id].up && !ids.has(id)) { delete FILM[id]; await idbDel(fdb, "ph", id); }
  const miss = r.items.filter(x => !FILM[x.id]); let n = 0;
  for (const x of miss) {
    n++; status(`Bajando nuestras fotos ${n} de ${miss.length}…`);
    const g = await rpc("wien_film_get", { p_id: x.id });
    if (g && g.ok && g.data && /^data:image\/jpeg;base64,/.test(g.data)) { const rec = { id: x.id, place: g.place || "", shot: +g.shot || 0, src: g.data, by: g.by || "", up: true }; FILM[x.id] = rec; await idbPut(fdb, "ph", x.id, rec); }
  }
  status("");
}

/* ---------- Arranque ---------- */
async function boot() {
  const [appDb, filmDb] = await Promise.all([idbOpen("wien", "ph"), idbOpen("wien-film", "ph")]);
  fdb = filmDb;
  PH = await idbAll(appDb, "ph"); if (appDb) appDb.close();
  FILM = await idbAll(fdb, "ph");
  await Promise.all([loadScript("photos.js?v=1a8e333086"), loadScript("photos2.js?v=50073513e3")]);
  KV = loadKV();
  if (CODE) await Promise.race([download(), new Promise(r => setTimeout(r, 25000))]);
  renderThumbs(); rebuild();
  const go = $("#go"); go.disabled = false; go.querySelector("span").textContent = "Ver nuestra película";
  upload();
}
$("#go").addEventListener("click", async () => {
  if (running) return; running = true;
  music.start(); fx.init();
  try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {}
  $("#gate").style.transition = "opacity .9s"; $("#gate").style.opacity = "0"; $("#gate").style.pointerEvents = "none";
  setTimeout(() => { $("#gate").style.display = "none"; }, 900);
  last = performance.now(); show(0); requestAnimationFrame(loop);
});
boot();
window.__film = { show: i => show(i), get FLAT() { return FLAT; }, get D() { return D; }, pause: setPause, placeFor, readExif, exifMs };
})();
